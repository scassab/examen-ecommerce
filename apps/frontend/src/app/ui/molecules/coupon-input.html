<div class="coupon">
  <label class="coupon__label" for="coupon-code">Cupón de descuento</label>

  @if (appliedCode(); as applied) {
    <div class="coupon__applied" data-testid="applied-coupon">
      <p-chip
        [label]="applied"
        icon="pi pi-ticket"
        [removable]="true"
        removeIcon="pi pi-times-circle"
        [class]="chipStyleClass()"
        (onRemove)="onClear()"
      />
    </div>
  } @else {
    <div class="coupon__controls">
      <input
        pInputText
        id="coupon-code"
        name="couponCode"
        placeholder="Ingresa tu cupón de descuento"
        autocomplete="off"
        [ngModel]="code()"
        (ngModelChange)="onCodeChange($event)"
        [attr.disabled]="disabled() ? '' : null"
        (keyup.enter)="onApply()"
      />

      <p-button
        label="Aplicar"
        icon="pi pi-check"
        [disabled]="!canApply() || disabled()"
        (onClick)="onApply()"
      />
    </div>
  }

  @if (feedback(); as message) {
    <p-message [severity]="message.severity" styleClass="coupon__feedback">{{ message.text }}</p-message>
  }
</div>
